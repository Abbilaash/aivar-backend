# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, dictating where to search for modules
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max characters of encode to include in file name
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be imported
# relative to prepend_sys_path
# relative_imports = false

# version locations - target is versions/
version_locations = %(here)s/alembic/versions

# version path separator; defaults to os.pathsep
# version_path_separator = :

# set to 'true' to search for migrations recursively
# recursive_version_locations = false

# set to 'true' to enable output of logging configuration
# config_file = 

[post_write_hooks]
# post_write_hooks defines scripts that are run after a new migration file is generated.
# formats: black, ruff, etc.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
