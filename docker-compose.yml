version: '3.8'

services:
  aivar-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivar-backend
    ports:
      - "8000:8000"
    environment:
      # Inject the DATABASE_URL to connect directly to Supabase PostgreSQL from local .env
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - API_KEY=aivar-dev-secret-key-12345
      - WATCHER_ENABLED=false # Disable watcher by default for local compose without cluster permissions
      - CLUSTER_NAME=local-docker-compose
      - CLUSTER_ENVIRONMENT=development
