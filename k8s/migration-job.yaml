apiVersion: batch/v1
kind: Job
metadata:
  name: aivar-db-migration
  namespace: default
  labels:
    app: aivar-db-migration
spec:
  template:
    metadata:
      labels:
        app: aivar-db-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: aivar-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic"]
          args: ["upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aivar-backend-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: aivar-backend-config
