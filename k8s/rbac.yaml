apiVersion: v1
kind: ServiceAccount
metadata:
  name: aivar-backend-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aivar-backend-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "serviceaccounts", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aivar-backend-rolebinding
subjects:
  - kind: ServiceAccount
    name: aivar-backend-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: aivar-backend-role
  apiGroup: rbac.authorization.k8s.io
