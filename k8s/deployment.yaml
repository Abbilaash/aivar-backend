apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivar-backend
  namespace: default
  labels:
    app: aivar-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aivar-backend
  template:
    metadata:
      labels:
        app: aivar-backend
    spec:
      serviceAccountName: aivar-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: aivar-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aivar-backend-secrets
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: aivar-backend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
