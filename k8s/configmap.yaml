apiVersion: v1
kind: ConfigMap
metadata:
  name: aivar-backend-config
  namespace: default
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_KEY: "aivar-dev-secret-key-12345"
  WATCHER_ENABLED: "true"
  CLUSTER_NAME: "aivar-production-cluster"
  CLUSTER_ENVIRONMENT: "production"
  RECONCILIATION_INTERVAL_SECS: "300"
  WATCHER_RETRY_DELAY_SECS: "5"
  WATCHER_MAX_RETRY_DELAY_SECS: "60"
